<!DOCTYPE html>
<html lang="es-HN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Pagos</title>

  <style>
    :root {
      --bg:#f4f7fb;
      --card:#fff;
      --text:#172033;
      --muted:#667085;
      --line:#d8e1ee;
      --blue:#0078ff;
      --green:#149c52;
      --yellow:#b56b00;
      --red:#d92d20;
      --green-bg:#e9f8ef;
      --yellow-bg:#fff3d7;
      --red-bg:#ffeded;
      --gray-bg:#f2f5f9;
      --shadow:0 10px 24px rgba(20,34,60,.08);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#eef5ff 0%,var(--bg) 260px);
      color:var(--text);
    }

    .app {
      width:min(1000px,100%);
      margin:auto;
      padding:12px;
      padding-bottom:40px;
    }

    .header {
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(12px);
      border:1px solid var(--line);
      border-radius:20px;
      padding:14px;
      box-shadow:var(--shadow);
      margin-bottom:12px;
    }

    h1 {
      margin:0;
      font-size:clamp(22px,5vw,32px);
      letter-spacing:-.035em;
    }

    .sub {
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
    }

    .totals {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-top:12px;
    }

    .total-box {
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
      background:#fff;
    }

    .label {
      color:var(--muted);
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .value {
      margin-top:3px;
      font-weight:950;
      font-size:clamp(16px,4vw,22px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .tools {
      display:grid;
      grid-template-columns:1.3fr .7fr;
      gap:8px;
      margin-bottom:12px;
    }

    input, select {
      width:100%;
      min-height:44px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      font:inherit;
      outline:none;
    }

    .list {
      display:grid;
      gap:10px;
    }

    .month {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .line {
      display:grid;
      align-items:center;
      border-bottom:1px solid var(--line);
    }

    .line:last-child { border-bottom:0; }

    .line1 {
      grid-template-columns:1fr auto auto;
      gap:10px;
      padding:11px;
      background:#fff;
    }

    .date {
      font-weight:950;
      font-size:17px;
    }

    .date small {
      display:block;
      color:var(--muted);
      font-weight:700;
      font-size:12px;
      margin-top:2px;
    }

    .pill {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:5px 9px;
      font-size:12px;
      font-weight:950;
      white-space:nowrap;
      border:1px solid transparent;
    }

    .ok { color:var(--green); background:var(--green-bg); border-color:#bde8cf; }
    .parcial { color:var(--yellow); background:var(--yellow-bg); border-color:#f3d18a; }
    .pendiente { color:var(--red); background:var(--red-bg); border-color:#ffc8c8; }
    .neutro { color:#475467; background:var(--gray-bg); border-color:var(--line); }

    .line2 {
      grid-template-columns:repeat(4,1fr);
      background:#fbfdff;
    }

    .cell {
      padding:10px;
      border-right:1px solid var(--line);
      min-width:0;
    }

    .cell:last-child { border-right:0; }

    .concept {
      font-weight:950;
      font-size:14px;
      margin-bottom:5px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .mini {
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
    }

    .mini strong {
      color:var(--text);
    }

    .line3 {
      grid-template-columns:1fr;
      padding:10px 11px;
      background:#fff;
      color:#344054;
      font-size:13px;
      line-height:1.35;
    }

    .empty-note {
      color:var(--muted);
    }

    .hidden {
      display:none;
    }

    @media(max-width:720px){
      .app { padding:9px; }
      .totals { grid-template-columns:repeat(2,1fr); }
      .tools { grid-template-columns:1fr; }
      .line1 { grid-template-columns:1fr; }
      .line2 { grid-template-columns:1fr 1fr; }
      .cell:nth-child(2) { border-right:0; }
      .cell:nth-child(1), .cell:nth-child(2) { border-bottom:1px solid var(--line); }
    }

    @media(max-width:420px){
      .totals { grid-template-columns:1fr; }
      .line2 { grid-template-columns:1fr; }
      .cell { border-right:0!important; border-bottom:1px solid var(--line); }
      .cell:last-child { border-bottom:0; }
    }

    @media print {
      body { background:#fff; }
      .header,.tools { position:static; box-shadow:none; }
      .tools { display:none; }
      .month { box-shadow:none; break-inside:avoid; }
    }
  </style>
</head>

<body>
  <div class="app">
    <section class="header">
      <h1>Lista de Pagos</h1>
      <p class="sub">Vista simple de 3 líneas por mes: resumen, conceptos y transferencias/notas.</p>

      <div class="totals" id="totals"></div>
    </section>

    <section class="tools">
      <input id="search" type="search" placeholder="Buscar fecha, banco, nota o concepto..." oninput="render()" />
      <select id="filter" onchange="render()">
        <option value="todos">Todos</option>
        <option value="pendiente">Pendiente</option>
        <option value="parcial">Parcial</option>
        <option value="pagado">Pagado</option>
      </select>
    </section>

    <main class="list" id="list"></main>
  </div>

  <script>
    /*
    =========================================================
    EDITA SOLO ESTA TABLA
    =========================================================

    Cada línea significa:
    ["FECHA", "CONCEPTO", MONTO, "ESTADO", PAGADO, "FECHA PAGO", "BANCO", "NOTA"]

    ESTADO puede ser:
    "pendiente", "parcial" o "pagado"

    Ejemplo pago completo:
    ["02/05/26", "Renta", 10000, "pagado", 10000, "05/05/26", "BAC", "Pago completo"],

    Ejemplo pago parcial:
    ["02/05/26", "Renta", 10000, "parcial", 4000, "05/05/26", "Capital One Checking mia", "Faltan L 6,000"],

    Bancos:
    Wells Fargo Rola
    Capital One Checking mia
    Capital One Savings mia
    Banco Atlántida
    BAC
    Occidente
    Banpaís
    Ficohsa
    */

    const TABLA_EDITABLE = [
      ["02/05/26", "Renta", 10000, "pagado", 0, "", "", ""],
      ["02/05/26", "Comida", 5874, "pagado", 0, "", "", ""],
      ["02/05/26", "Agua", 250, "pagado", 0, "", "", ""],
      ["02/05/26", "Luz", 0, "pagado", 0, "", "", "Monto según recibo"],
      ["02/06/26", "Renta", 10000, "pagado", 0, "", "", ""],
      ["02/06/26", "Comida", 5874, "pagado", 0, "", "", ""],
      ["02/06/26", "Agua", 250, "pagado", 0, "", "", ""],
      ["02/06/26", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/07/26", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/07/26", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/07/26", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/07/26", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/08/26", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/08/26", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/08/26", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/08/26", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/09/26", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/09/26", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/09/26", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/09/26", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/10/26", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/10/26", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/10/26", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/10/26", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/11/26", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/11/26", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/11/26", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/11/26", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/12/26", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/12/26", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/12/26", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/12/26", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/01/27", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/01/27", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/01/27", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/01/27", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/02/27", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/02/27", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/02/27", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/02/27", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/03/27", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/03/27", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/03/27", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/03/27", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
      ["02/04/27", "Renta", 10000, "pendiente", 0, "", "", ""],
      ["02/04/27", "Comida", 5874, "pendiente", 0, "", "", ""],
      ["02/04/27", "Agua", 250, "pendiente", 0, "", "", ""],
      ["02/04/27", "Luz", 0, "pendiente", 0, "", "", "Monto según recibo"],
    ];

    /*
    =========================================================
    NO TOCAR DE AQUÍ PARA ABAJO
    =========================================================
    */

    const moneyFmt = new Intl.NumberFormat("es-HN", {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });

    const dateFmt = new Intl.DateTimeFormat("es-HN", {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    });

    function money(n){
      return "L " + moneyFmt.format(Number(n || 0));
    }

    function esc(v){
      return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function parseDate(fecha){
      const [d,m,y] = fecha.split("/").map(Number);
      const yyyy = y < 70 ? 2000 + y : 1900 + y;
      return new Date(yyyy, m - 1, d, 12, 0, 0);
    }

    function longDate(fecha){
      const t = dateFmt.format(parseDate(fecha));
      return t.charAt(0).toUpperCase() + t.slice(1);
    }

    function cleanStatus(status){
      const s = String(status || "pendiente").toLowerCase().trim();
      return ["pagado","parcial","pendiente"].includes(s) ? s : "pendiente";
    }

    function itemObj(row){
      const [fecha, concepto, monto, estado, pagado, fechaPago, banco, nota] = row;
      let st = cleanStatus(estado);
      const total = Number(monto || 0);
      const paid = Number(pagado || 0);
      if(total > 0 && paid >= total) st = "pagado";
      if(total > 0 && paid > 0 && paid < total && st !== "pagado") st = "parcial";
      return {
        fecha,
        concepto,
        monto: total,
        estado: st,
        pagado: paid,
        faltante: Math.max(0, total - paid),
        fechaPago,
        banco,
        nota
      };
    }

    function groupByMonth(){
      const map = new Map();
      TABLA_EDITABLE.map(itemObj).forEach(item => {
        if(!map.has(item.fecha)) map.set(item.fecha, []);
        map.get(item.fecha).push(item);
      });
      return [...map.entries()].map(([fecha, items]) => ({ fecha, items }));
    }

    function monthTotals(items){
      return items.reduce((a,i) => {
        a.total += i.monto;
        a.pagado += i.pagado;
        a.faltante += i.faltante;
        if(i.estado === "pagado") a.pagados++;
        if(i.estado === "parcial") a.parciales++;
        if(i.estado === "pendiente") a.pendientes++;
        return a;
      }, {total:0,pagado:0,faltante:0,pagados:0,parciales:0,pendientes:0});
    }

    function globalTotals(months){
      return months.reduce((a,m) => {
        const t = monthTotals(m.items);
        a.total += t.total;
        a.pagado += t.pagado;
        a.faltante += t.faltante;
        a.pendientes += t.pendientes;
        a.parciales += t.parciales;
        return a;
      }, {total:0,pagado:0,faltante:0,pendientes:0,parciales:0});
    }

    function statusPill(status){
      if(status === "pagado") return `<span class="pill ok">✅ Pagado</span>`;
      if(status === "parcial") return `<span class="pill parcial">🟡 Parcial</span>`;
      return `<span class="pill pendiente">🔴 Pendiente</span>`;
    }

    function monthStatus(t){
      if(t.total > 0 && t.faltante <= 0) return `<span class="pill ok">✅ Mes pagado</span>`;
      if(t.pagado > 0) return `<span class="pill parcial">🟡 Mes parcial</span>`;
      return `<span class="pill pendiente">🔴 Mes pendiente</span>`;
    }

    function renderTotals(months){
      const t = globalTotals(months);
      document.getElementById("totals").innerHTML = `
        <div class="total-box"><div class="label">Total</div><div class="value">${money(t.total)}</div></div>
        <div class="total-box"><div class="label">Pagado</div><div class="value">${money(t.pagado)}</div></div>
        <div class="total-box"><div class="label">Faltante</div><div class="value">${money(t.faltante)}</div></div>
        <div class="total-box"><div class="label">Pend./parcial</div><div class="value">${t.pendientes + t.parciales}</div></div>
      `;
    }

    function transferText(items){
      const texts = items
        .filter(i => i.pagado > 0 || i.fechaPago || i.banco || i.nota)
        .map(i => {
          const parts = [];
          if(i.pagado > 0) parts.push(`${i.concepto}: ${money(i.pagado)}`);
          if(i.fechaPago) parts.push(`fecha ${i.fechaPago}`);
          if(i.banco) parts.push(`banco ${i.banco}`);
          if(i.nota) parts.push(`nota: ${i.nota}`);
          return parts.join(" · ");
        });

      if(!texts.length) return `<span class="empty-note">Sin transferencias registradas.</span>`;
      return texts.map(esc).join(" | ");
    }

    function conceptCell(i){
      return `
        <div class="cell">
          <div class="concept">${esc(i.concepto)}</div>
          ${statusPill(i.estado)}
          <div class="mini">
            Monto: <strong>${money(i.monto)}</strong><br>
            Pagó: <strong>${money(i.pagado)}</strong> · Falta: <strong>${money(i.faltante)}</strong>
          </div>
        </div>
      `;
    }

    function monthCard(month){
      const t = monthTotals(month.items);
      return `
        <section class="month">
          <div class="line line1">
            <div class="date">
              ${esc(month.fecha)}
              <small>${longDate(month.fecha)}</small>
            </div>
            ${monthStatus(t)}
            <span class="pill neutro">Falta ${money(t.faltante)}</span>
          </div>

          <div class="line line2">
            ${month.items.map(conceptCell).join("")}
          </div>

          <div class="line line3">
            <strong>Transferencias / notas:</strong> ${transferText(month.items)}
          </div>
        </section>
      `;
    }

    function passesFilters(month){
      const q = document.getElementById("search").value.trim().toLowerCase();
      const f = document.getElementById("filter").value;

      if(f !== "todos" && !month.items.some(i => i.estado === f)) return false;
      if(!q) return true;

      const text = [
        month.fecha,
        longDate(month.fecha),
        ...month.items.flatMap(i => [
          i.concepto, i.monto, i.estado, i.pagado, i.fechaPago, i.banco, i.nota
        ])
      ].join(" ").toLowerCase();

      return text.includes(q);
    }

    function render(){
      const allMonths = groupByMonth();
      renderTotals(allMonths);

      const months = allMonths.filter(passesFilters);
      document.getElementById("list").innerHTML = months.length
        ? months.map(monthCard).join("")
        : `<div class="month"><div class="line line3">No hay resultados con esos filtros.</div></div>`;
    }

    render();
  </script>
</body>
</html>
